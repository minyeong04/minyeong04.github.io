<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>동적 계산기 프로그램</title>
</head>
<body style="font-family: sans-serif; padding: 20px; max-width: 350px; margin: 0 auto;">

    <h2 style="text-align: center; color: #333;">자바스크립트 계산기</h2>
    <hr style="border: 0; height: 1px; background: #ccc; margin-bottom: 20px;">

    <div style="background-color: #f4f4f4; border: 2px solid #ccc; padding: 15px; border-radius: 10px; box-shadow: 2px 2px 8px rgba(0,0,0,0.1);">
        
        <input id="display" type="text" readonly style="width: 100%; height: 50px; text-align: right; font-size: 1.8em; margin-bottom: 15px; padding: 5px; box-sizing: border-box; border: 1px solid #aaa; background: #fff;">

        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
            <button onclick="clearDisplay()" style="grid-column: span 2; height: 50px; font-size: 1.2em; font-weight: bold; background: #ff8a80; cursor: pointer;">C</button>
            <button onclick="appendValue('/')" style="height: 50px; font-size: 1.2em; background: #e0e0e0; cursor: pointer;">/</button>
            <button onclick="appendValue('*')" style="height: 50px; font-size: 1.2em; background: #e0e0e0; cursor: pointer;">*</button>

            <button onclick="appendValue('7')" style="height: 50px; font-size: 1.2em; background: #fff; cursor: pointer;">7</button>
            <button onclick="appendValue('8')" style="height: 50px; font-size: 1.2em; background: #fff; cursor: pointer;">8</button>
            <button onclick="appendValue('9')" style="height: 50px; font-size: 1.2em; background: #fff; cursor: pointer;">9</button>
            <button onclick="appendValue('-')" style="height: 50px; font-size: 1.2em; background: #e0e0e0; cursor: pointer;">-</button>

            <button onclick="appendValue('4')" style="height: 50px; font-size: 1.2em; background: #fff; cursor: pointer;">4</button>
            <button onclick="appendValue('5')" style="height: 50px; font-size: 1.2em; background: #fff; cursor: pointer;">5</button>
            <button onclick="appendValue('6')" style="height: 50px; font-size: 1.2em; background: #fff; cursor: pointer;">6</button>
            <button onclick="appendValue('+')" style="height: 50px; font-size: 1.2em; background: #e0e0e0; cursor: pointer;">+</button>

            <button onclick="appendValue('1')" style="height: 50px; font-size: 1.2em; background: #fff; cursor: pointer;">1</button>
            <button onclick="appendValue('2')" style="height: 50px; font-size: 1.2em; background: #fff; cursor: pointer;">2</button>
            <button onclick="appendValue('3')" style="height: 50px; font-size: 1.2em; background: #fff; cursor: pointer;">3</button>
            <button onclick="calculate()" style="grid-row: span 2; height: 110px; font-size: 1.5em; background: #80f1b2; font-weight: bold; cursor: pointer;">=</button>

            <button onclick="appendValue('0')" style="grid-column: span 2; height: 50px; font-size: 1.2em; background: #fff; cursor: pointer;">0</button>
            <button onclick="appendValue('.')" style="height: 50px; font-size: 1.2em; background: #fff; cursor: pointer;">.</button>
        </div>
    </div>

    <script>
        let display = document.getElementById("display");

        // 값을 디스플레이창 뒤에 동적으로 추가하는 함수
        function appendValue(val) {
            display.value += val;
        }

        // 화면 지우기 (C)
        function clearDisplay() {
            display.value = "";
        }

        // 수식을 동적으로 계산하여 연산 결과를 화면에 표기
        function calculate() {
            try {
                // eval 함수를 통해 문자열 수식을 계산
                if(display.value !== "") {
                    display.value = eval(display.value);
                }
            } catch (error) {
                display.value = "Error"; // 수식이 잘못되었을 때 예외 처리
            }
        }
    </script>

</body>
</html>
